<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #tela { width: 100%; height: 100%; touch-action: none; }
</style>
<div id="tela"></div>
<script src="gestos.js"></script>
<script type="module">
import RFB from './core/rfb.js';

const tela = document.getElementById('tela');
const rfb = new RFB(tela, 'ws://' + location.host + '/websockify');
rfb.scaleViewport = true;
rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password: prompt('Senha') }));

function mouse(c, tipo, x, y, botao) {
  const buttons = tipo === 'mouseup' ? 0 : (botao === 2 ? 2 : 1);
  c.dispatchEvent(new MouseEvent(tipo, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: botao, buttons: buttons }));
}

instalarGestos(tela, (m) => {
  const c = tela.querySelector('canvas');
  if (!c) return;
  if (m.t === 'wheel') {
    c.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: m.x, clientY: m.y, deltaX: m.dx, deltaY: m.dy, deltaMode: 0 }));
  } else if (m.t === 'click') {
    const b = m.button === 'right' ? 2 : 0;
    mouse(c, 'mousemove', m.x, m.y, 0);
    mouse(c, 'mousedown', m.x, m.y, b);
    mouse(c, 'mouseup', m.x, m.y, b);
  }
}, (t) => ({ x: t.clientX, y: t.clientY, k: 1 }));
</script>
